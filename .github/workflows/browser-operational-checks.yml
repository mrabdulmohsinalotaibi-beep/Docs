name: Browser operational checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9,21 * * *'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-worker.mjs --check
      - run: npm install --no-save --package-lock=false @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Execute isolated browser checks
        run: |
          mkdir -p browser-results
          cat > browser-smoke.mjs <<'EOF'
          import {chromium,firefox,webkit} from '@playwright/test';
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const source=await readFile('worker.js','utf8');
          const {default:worker}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          globalThis.fetch=async()=>{throw Error('Outbound worker network forbidden')};
          const origin='http://127.0.0.1:4173';
          let serverUnavailable=false;
          let blockedRequests=0;
          const server=createServer(async(req,res)=>{
            if(serverUnavailable){blockedRequests++;req.socket.destroy();return}
            try{
              const url=new URL(req.url,origin);
              if(url.origin!==origin){res.writeHead(403).end();return}
              if(url.pathname.startsWith('/api/')||url.pathname==='/health'){
                res.writeHead(401,{'content-type':'application/json'}).end(JSON.stringify({ok:false,code:'UNAUTHORIZED'}));return;
              }
              const response=await worker.fetch(new Request(url,{method:req.method,headers:req.headers}),{});
              res.writeHead(response.status,Object.fromEntries(response.headers));
              res.end(Buffer.from(await response.arrayBuffer()));
            }catch(e){console.error(e);res.writeHead(500).end()}
          });
          await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
          let failures=0;
          try{
            for(const [name,engine] of Object.entries({chromium,firefox,webkit})){
              const browser=await engine.launch();
              try{
                for(const viewport of [{width:1280,height:900},{width:390,height:844},{width:820,height:1180}]){
                  const context=await browser.newContext({viewport});
                  const page=await context.newPage();
                  const errors=[];
                  page.on('pageerror',e=>errors.push(e.message));
                  const label=name+'-'+viewport.width;
                  try{
                    await page.goto(origin,{waitUntil:'load'});
                    await page.locator('#authGate').waitFor({state:'visible'});
                    await page.locator('#tabRegister').click();
                    await page.locator('#registerName').waitFor({state:'visible'});
                    await page.locator('#tabLogin').click();
                    await page.locator('#registerName').waitFor({state:'hidden'});
                    assert.equal(await page.locator('#emailInput').count(),1);
                    assert.equal(await page.locator('#passwordInput').count(),1);
                    assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2),'horizontal overflow');
                    // Mock authentication only inside this isolated browser context.
                    // All other API requests remain denied by the loopback server.
                    const users=['usr_browser_fixture_a','usr_browser_fixture_b'].map((id,i)=>({id,name:'Test account '+i,role:'teacher',loginIdentifier:'fixture'+i+'@example.invalid'}));
                    let session=null;
                    await context.route('**/api/auth/**',async route=>{
                      const action=new URL(route.request().url()).pathname.split('/').pop();
                      if(action==='login'){
                        const body=route.request().postDataJSON();
                        session=users.find(u=>u.loginIdentifier===body.loginIdentifier&&body.password==='FixturePassword123')||null;
                      }
                      if(action==='logout'){session=null;return route.fulfill({json:{ok:true}})}
                      if((action==='login'||action==='me')&&session)return route.fulfill({json:{ok:true,user:session}});
                      return route.fulfill({status:401,json:{ok:false,code:'UNAUTHORIZED'}});
                    });
                    page.on('dialog',dialog=>dialog.accept());
                    for(const user of users){
                      await page.locator('#emailInput').fill(user.loginIdentifier);
                      await page.locator('#passwordInput').fill('FixturePassword123');
                      await page.locator('#submitAuth').click();
                      try{await page.locator('#appMain').waitFor({state:'visible',timeout:15000})}catch(e){console.error('Mock login diagnostic '+label,await page.locator('#authMsg').textContent(), 'online=',await page.evaluate(()=>navigator.onLine));throw e}
                      await page.waitForFunction(name=>document.querySelector('#accountName')?.textContent===name,user.name);
                      await page.locator('#workspaceNav').waitFor({state:'visible'});
                      for(const tab of ['documents','students','reports','messages','home']){
                        const button=page.locator('#workspaceNav [data-workspace="'+tab+'"]');
                        await button.click();
                        assert.equal(await button.getAttribute('aria-current'),'page');
                      }
                      await page.locator('#logoutDocs').click();
                      await page.locator('#authGate').waitFor({state:'visible'});
                      assert.equal(await page.locator('#appMain').isVisible(),false);
                    }
                    console.log('PASS mock-account navigation '+label);
                    // Verify real service-worker caching and offline navigation, without an account.
                    await page.waitForFunction(async()=>{
                      if(!navigator.serviceWorker.controller)return false;
                      const entries=await Promise.all(['/','/peer-sync.js','/auto-sync.js'].map(p=>caches.match(p)));
                      return entries.every(r=>r?.ok);
                    },null,{timeout:30000});
                    // Independently test loss of connectivity to the origin without
                    // using the browser engine's offline emulation.
                    const blockedBefore=blockedRequests;
                    serverUnavailable=true;
                    try{
                      const cached=await page.goto(origin+'/?origin-unavailable=1',{waitUntil:'load'});
                      assert.ok(cached?.ok(),'cached shell must load when origin is unreachable');
                      await page.locator('#authGate').waitFor({state:'visible'});
                      await page.locator('#tabRegister').click();
                      await page.locator('#registerName').waitFor({state:'visible'});
                      await page.locator('#tabLogin').click();
                      await page.locator('#registerName').waitFor({state:'hidden'});
                      assert.ok(blockedRequests>blockedBefore,'must exercise a failed origin request');
                      console.log('PASS origin-unavailable '+label);
                    }finally{serverUnavailable=false}
                    // Keep the original native offline test as a separate required check.
                    await context.setOffline(true);
                    try{
                      // Reopen via a new URL in WebKit: reload in its Linux test engine
                      // previously aborted with an internal error before a response.
                      // Keep actual offline mode and require a working cached page.
                      const response=name==='webkit'
                        ?await page.goto(origin+'/?offline-reopen=1',{waitUntil:'load'})
                        :await page.reload({waitUntil:'load'});
                      console.log('Offline navigation method: '+(name==='webkit'?'reopen':'reload')+' '+label);
                      assert.ok(response?.ok(),'offline shell must load from cache');
                      assert.equal(await page.evaluate(()=>navigator.onLine),false);
                      await page.locator('#authGate').waitFor({state:'visible'});
                      await page.locator('#tabRegister').click();
                      await page.locator('#registerName').waitFor({state:'visible'});
                      await page.locator('#tabLogin').click();
                      await page.locator('#registerName').waitFor({state:'hidden'});
                    }finally{await context.setOffline(false)}
                    assert.deepEqual(errors,[]);
                    console.log('PASS '+label);
                  }catch(e){failures++;console.error('FAIL '+label,e);await page.screenshot({path:'browser-results/'+label+'.png',fullPage:true}).catch(()=>{})}
                  finally{await context.close()}
                }
              }finally{await browser.close()}
            }
          }finally{server.close()}
          if(failures)process.exitCode=1;
          EOF
          node browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results/
          if-no-files-found: ignore
