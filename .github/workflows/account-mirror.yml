name: Account local mirror checks
on:
  push:
    branches:
      - feature/account-local-mirror-auto-20261119
  pull_request:
    paths:
      - worker.js
      - tests/account-auto-mirror.test.mjs
      - tests/unified-account-work.test.mjs
      - tests/archive-audit.test.mjs
      - tests/account-integrity-panel.test.mjs
      - tests/safe-multi-backup-restore.test.mjs
      - .github/workflows/account-mirror.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/account-auto-mirror.test.mjs tests/unified-account-work.test.mjs tests/archive-audit.test.mjs tests/account-integrity-panel.test.mjs tests/safe-multi-backup-restore.test.mjs
