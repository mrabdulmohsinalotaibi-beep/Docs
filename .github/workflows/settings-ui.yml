name: Docs settings UI checks
on:
  push:
    branches: [main]
    paths: [worker.js, tests/settings-ui.test.mjs, tests/ios-safe-frame.test.mjs, .github/workflows/settings-ui.yml]
  pull_request:
    paths: [worker.js, tests/settings-ui.test.mjs, tests/ios-safe-frame.test.mjs, .github/workflows/settings-ui.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --test tests/settings-ui.test.mjs tests/ios-safe-frame.test.mjs
