name: Official Docs A4 checks
on:
  push:
    branches: [main, feature/official-a4-docs-1448]
  pull_request:
    paths: [worker.js, data/a4-guidance-1448.json, tests/official-a4.test.mjs, .github/workflows/official-a4.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --test tests/official-a4.test.mjs
