name: Docs peer-sync checks
on:
  push:
    branches: [feature/p2p-sync-after-a4]
  pull_request:
    paths: [worker.js, peer-sync.js, tests/peer-sync.test.mjs, tests/offline-readiness.test.mjs, tests/offline-browser.test.mjs, .github/workflows/peer-sync-check.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --check peer-sync.js
      - run: node --test tests/peer-sync.test.mjs tests/offline-readiness.test.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save --ignore-scripts playwright-core@1.58.2
      - name: Find Chrome
        run: which google-chrome || which google-chrome-stable
      - name: Offline startup and local unlock browser test
        run: node --test tests/offline-browser.test.mjs
      - name: WebRTC two-browser smoke test
        run: node --test tests/p2p-browser.test.mjs
      - name: Department catalog browser test
        run: node --test tests/program-browser.test.mjs
